version: "3.9"

# ==============================================================================
# ASPES - AI Smart Academic Project Evaluation System
# Docker Compose configuration
#
# Usage:
#   Development:  docker-compose up
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Build only:   docker-compose build
#   Stop:         docker-compose down
#   Remove data:  docker-compose down -v
# ==============================================================================

networks:
  aspes_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  model_cache:
    driver: local

services:

  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aspes_postgres
    restart: unless-stopped
    networks:
      - aspes_network
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-aspes_db}
      POSTGRES_USER: ${DATABASE_USER:-aspes_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aspes_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-aspes_user} -d ${DATABASE_NAME:-aspes_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Redis (Celery broker + result backend + caching)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aspes_redis
    restart: unless-stopped
    networks:
      - aspes_network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: aspes_backend
    restart: unless-stopped
    networks:
      - aspes_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-aspes_user}:${DATABASE_PASSWORD:-aspes_password}@postgres:5432/${DATABASE_NAME:-aspes_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app                     # Hot-reload in development
      - uploads_data:/app/uploads
      - model_cache:/app/models            # Cache downloaded AI models
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------------------------
  # Celery Worker (AI evaluation tasks)
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: aspes_celery_worker
    restart: unless-stopped
    networks:
      - aspes_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-aspes_user}:${DATABASE_PASSWORD:-aspes_password}@postgres:5432/${DATABASE_NAME:-aspes_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - model_cache:/app/models
    command: >
      celery -A app.tasks.celery_app worker
             --loglevel=info
             --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
             --queues=evaluation,default
    deploy:
      resources:
        limits:
          memory: 4G           # AI models can be memory-hungry

  # ----------------------------------------------------------------------------
  # Celery Beat (Scheduled tasks - cleanup, reports, etc.)
  # ----------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: aspes_celery_beat
    restart: unless-stopped
    networks:
      - aspes_network
    depends_on:
      - redis
      - celery_worker
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    command: >
      celery -A app.tasks.celery_app beat
             --loglevel=info
             --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ----------------------------------------------------------------------------
  # Flower - Celery monitoring dashboard
  # ----------------------------------------------------------------------------
  flower:
    image: mher/flower:2.0
    container_name: aspes_flower
    restart: unless-stopped
    networks:
      - aspes_network
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
      FLOWER_BASIC_AUTH: admin:aspes_flower_password
    ports:
      - "5555:5555"

  # ----------------------------------------------------------------------------
  # React Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: aspes_frontend
    restart: unless-stopped
    networks:
      - aspes_network
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
      REACT_APP_WS_URL: ws://localhost:8000/ws
      CHOKIDAR_USEPOLLING: "true"          # Needed for hot-reload in Docker on some OS
    volumes:
      - ./frontend/src:/app/src            # Hot-reload in development
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
